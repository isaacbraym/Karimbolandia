<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amostra de ambientação</title><div id="app"><canvas id="game"></canvas><div id="ui"></div></div>
<style>nav{position:fixed;bottom:12px;left:12px;right:12px;z-index:200;display:flex;gap:6px;flex-wrap:wrap}nav[hidden]{display:none}nav button{border:1px solid #8ab373;border-radius:18px;background:#183528e8;color:#f1efd0;padding:8px 14px;font:600 13px sans-serif;cursor:pointer}nav button:hover{background:#3c6240}</style>
<nav><button id="city">Cidade atacada: início</button><button id="forest">Floresta: início</button><button id="village">Vilarejo</button><button id="temple">Templo: morro e passagem</button><button id="station">Estação esquecida</button><button id="garden">Jardim secreto</button><button id="time">Relógio da mata</button><button id="roots">Refúgio das raízes</button><button id="chase">Perseguição do macaco</button><button id="aim">Tutorial de mira</button><button id="boxing">Tutorial de boxe</button><button id="club">Balada: porta e narração</button><button id="play">Jogar</button><button id="hide">Ocultar botões</button></nav>
<script type="module">
import '/src/style.css';import{Game}from'/src/game/game.ts';import{loadJungle}from'/src/art/jungle.ts';import{setProfile}from'/src/core/persistence.ts';import{reloadProgress,settings}from'/src/core/storage.ts';import{newCtl}from'/tests/helpers/bot.ts';
setProfile('amostra-ambientacao');reloadProgress();settings.quality='high';settings.narrator=false;settings.showFps=false;
const game=new Game(document.querySelector('#game'),document.querySelector('#ui'));await game.boot('/');await loadJungle('/','high');game.play(true,2);game.pause();game.menus.hideAll();
let w=game.world;function scene(x=w.data.playerStart.x){game.pause();game.menus.hideAll();w.player.reset(x,w.level.reliefSurface(x)??w.level.groundBelow(x,1000)??1024);w.player.invuln=0;w.cameraSnap();w.camera.zoom=.95;w.camera.snapTo(x+65,w.player.y-25);game.render(0);}
function stage(n,x,narrator=false){settings.narrator=narrator;game.play(true,n);game.aimPending=false;w=game.world;if(narrator){w.director.cine=null;w.narrator.stop();}scene(x);}
document.querySelector('#city').onclick=()=>stage(1);document.querySelector('#forest').onclick=()=>stage(2);document.querySelector('#village').onclick=()=>stage(2,712*32);document.querySelector('#play').onclick=()=>game.resume();document.querySelector('#hide').onclick=()=>document.querySelector('nav').hidden=true;
for(const [label,col] of [['Pântano',243],['Desfiladeiro',352],['Lago',504],['Acampamento',610],['Roças',865],['Riacho',947],['Pomares',1200],['Santuário',1350]]){const b=document.createElement('button');b.textContent=label;b.onclick=()=>stage(2,col*32);document.querySelector('nav').insertBefore(b,document.querySelector('#play'));}
const letterButton=document.createElement('button');letterButton.textContent='Pombo e roubo da carta';letterButton.onclick=()=>{stage(2,211*32+16);w.enemies=[];w.director.cine=null;w.narrator.stop();w.letter.reset(w);w.encounters.completed.delete('jungle:letter-chase');for(const t of w.data.triggers)w.director.triggered.add(t.id);game.resume();};document.querySelector('nav').insertBefore(letterButton,document.querySelector('#play'));
document.querySelector('#chase').onclick=()=>{stage(2);w.hooks.onMinigame('chase',()=>{});game.resume();};
document.querySelector('#aim').onclick=()=>{stage(1);game.resume();game.showAimTutorial();};
document.querySelector('#boxing').onclick=()=>{stage(2);history.replaceState(null,'',location.pathname+'?tut=1');w.hooks.onMinigame('boxing',()=>{});game.resume();};
function passage(n,id){stage(n);const r=w.data.rooms.find(r=>id==='temple'?r.kind==='temple'&&!r.passage:r.passage?.id===id),d=w.data.doors.find(d=>d.kind==='in'&&d.tx>=r.x&&d.tx<r.x+r.w&&d.ty>=r.y&&d.ty<=r.y+r.h);scene(d.x-585);w.camera.zoom=.72;w.camera.x=d.x-625;w.camera.y=1024-380;w.enemies=[];w.player.invuln=999;for(const t of w.data.triggers)w.director.triggered.add(t.id);game.render(0);}
document.querySelector('#temple').onclick=()=>passage(2,'temple');
document.querySelector('#station').onclick=()=>passage(1,'city:old-station');document.querySelector('#garden').onclick=()=>passage(1,'city:roof-garden');document.querySelector('#time').onclick=()=>passage(2,'jungle:lost-time');document.querySelector('#roots').onclick=()=>passage(2,'jungle:root-vault');
document.querySelector('#club').onclick=()=>{stage(1,undefined,true);const r=w.club.room;const d=w.data.doors.find(d=>d.kind==='in'&&d.tx>=r.x&&d.tx<=r.x+r.w);scene(d.x);w.enemies=[];w.player.invuln=999;for(const t of w.data.triggers)w.director.triggered.add(t.id);w.narrator.queue.length=0;w.narrator.played.add(1);game.resume();};
window.qa={game,get w(){return w},scene,stage,render:()=>game.render(0),newCtl,passage};const q=new URLSearchParams(location.search);if(q.has('passagem')){const id=q.get('passagem');passage(id.startsWith('city:')?1:2,id);}else if(q.has('trecho'))stage(2,Number(q.get('trecho'))*32);else if(q.has('cidade'))stage(1);else scene();window.ready=true;
</script></html>
